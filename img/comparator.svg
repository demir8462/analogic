<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1d07"/><stop offset="1" stop-color="#0f0b05"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#g)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
  <text x="50" y="62" fill="#fbbf24" font-size="15" letter-spacing="4">★ COMPARATOR v6b</text>
  <text x="50" y="104" fill="#ffffff" font-size="34" font-weight="700">Rail-to-rail StrongARM</text>
  <text x="50" y="136" fill="#d6c9a5" font-size="17">Works at any common-mode level and clocks the whole conversion with its own READY pulse.</text>

  <!-- input range bar -->
  <text x="50" y="190" fill="#a8a29e" font-size="13" letter-spacing="2">CHARACTERIZED WINDOW · EXTENDS BEYOND BOTH RAILS</text>
  <rect x="50" y="204" width="560" height="18" rx="9" fill="#1c1917" stroke="#44403c"/>
  <rect x="59" y="204" width="542" height="18" rx="9" fill="url(#bar)"/>
  <text x="50" y="248" fill="#a8a29e" font-size="13">0 V</text>
  <text x="50" y="270" fill="#fde68a" font-size="14">30 mV</text>
  <text x="610" y="248" fill="#a8a29e" font-size="13" text-anchor="end">1.8 V</text>
  <text x="610" y="270" fill="#fde68a" font-size="14" text-anchor="end">1790 mV</text>

  <!-- stats -->
  <g text-anchor="middle">
    <text x="780" y="200" fill="#fbbf24" font-size="40" font-weight="800">σ 1.6–2.8</text>
    <text x="780" y="228" fill="#a8a29e" font-size="14">mV offset, no calibration</text>
    <text x="780" y="256" fill="#78716c" font-size="12">extracted-layout Monte Carlo</text>

    <text x="990" y="200" fill="#fbbf24" font-size="40" font-weight="800">720/720</text>
    <text x="990" y="228" fill="#a8a29e" font-size="14">correct decisions</text>
    <text x="990" y="256" fill="#78716c" font-size="12">±1 mV, all corners</text>

    <text x="1180" y="200" fill="#fbbf24" font-size="40" font-weight="800">2.4–4.1</text>
    <text x="1180" y="228" fill="#a8a29e" font-size="14">ns CLK → READY</text>
    <text x="1180" y="256" fill="#78716c" font-size="12">DRC / LVS clean</text>
  </g>
</svg>
