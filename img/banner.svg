<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2745" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)" opacity="0.6"/>

  <!-- sleeping line with event spikes -->
  <path d="M0 300 H180 L190 300 L196 250 L204 330 L212 300 H430 L440 300 L446 235 L456 345 L466 300 H560 L570 300 L576 240 L584 340 L592 300 H760 L770 300 L776 255 L784 325 L792 300 H1280"
        fill="none" stroke="url(#wave)" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#22d3ee">
    <circle cx="200" cy="250" r="4"/><circle cx="451" cy="235" r="4"/><circle cx="780" cy="255" r="4"/><circle cx="580" cy="240" r="4"/>
  </g>
  <text x="60" y="333" fill="#64748b" font-size="13" letter-spacing="2">ASLEEP · 24 nW</text>
  <text x="216" y="262" fill="#22d3ee" font-size="12" letter-spacing="2">EVENT</text>

  <g transform="translate(50,0)">
  <text x="610" y="70" fill="#64748b" font-size="12" letter-spacing="2">READY (self-clock)</text>
  <path d="M610 112 H626 V84 H644 V112 H662 V84 H680 V112 H698 V84 H716 V112 H734 V84 H752 V112 H770 V84 H788 V112 H806 V84 H824 V112 H840"
        fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
  <!-- CDAC residue converging, one bit per READY -->
  <text x="610" y="146" fill="#64748b" font-size="12" letter-spacing="2">CDAC SETTLING</text>
  <path d="M610 205 V160 H650 V190 H690 V172 H730 V184 H770 V177 H810 V181 H840"
        fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round"/>
  <path d="M610 181 H840" stroke="#334155" stroke-width="1" stroke-dasharray="3 4"/>

  </g>
  <!-- title -->
  <text x="60" y="110" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="6">ANALOGIC</text>
  <rect x="62" y="124" width="84" height="4" rx="2" fill="#22d3ee"/>
  <text x="60" y="165" fill="#cbd5e1" font-size="24">Event-driven 10-bit SAR ADC in open-source sky130</text>
  <text x="60" y="196" fill="#94a3b8" font-size="18">Asynchronous, clockless. Sleeps at nanowatts.</text>

  <!-- stat chips -->
  <g font-size="14" fill="#e2e8f0">
    <g transform="translate(900,60)">
      <rect width="320" height="62" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="20" y="40" font-size="30" font-weight="700" fill="#22d3ee">36 pJ</text>
      <text x="130" y="38" fill="#94a3b8">per conversion</text>
    </g>
    <g transform="translate(900,134)">
      <rect width="320" height="62" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="20" y="40" font-size="30" font-weight="700" fill="#22d3ee">24 nW</text>
      <text x="130" y="38" fill="#94a3b8">idle power, 25 °C</text>
    </g>
    <g transform="translate(900,208)">
      <rect width="320" height="62" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="20" y="40" font-size="30" font-weight="700" fill="#22d3ee">123 ns</text>
      <text x="130" y="38" fill="#94a3b8">self-clocked, 10 bit</text>
    </g>
  </g>
</svg>
